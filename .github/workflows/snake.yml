name: generate profile cards

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours, off the top of the hour (GitHub drops :00 runs under load)
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8250df&color_dots=#ebedf0,#d8c7ff,#b392f0,#8957e5,#6639ba
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#1f2633,#3b2a6b,#6e40c9,#a371f7,#d2a8ff

      - name: Build contributions card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/contrib_card.py "${{ github.repository_owner }}" /tmp/cards
          sudo cp /tmp/cards/* dist/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
