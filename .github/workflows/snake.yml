name: generate profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test (nothing is published if this fails)
        run: |
          python -m pip install --quiet pytest fonttools
          python -m pytest -q

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#bc4c00&color_dots=#ebedf0,#fde3cf,#f7b98a,#f0883e,#bc4c00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#1f2633,#4d2a12,#8a4517,#c4631f,#f0883e

      - name: Build contributions card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/contrib_card.py "${{ github.repository_owner }}" /tmp/cards
          sudo cp /tmp/cards/* dist/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
